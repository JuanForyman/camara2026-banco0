<script>
/* Motor de estudo v2 (puro, sem DOM): v1 + campos (famílias de átomos vizinhos). Usado pelo site e por scripts.
   Entrada: eventos {q, ok(true|false|null), t(ms)} e questões {id,t,a[],g}.
   Unidade de conhecimento: átomo (artigo). Questão sem átomo vira átomo próprio "Q:<id>". */
(function (root) {
  const DAY = 864e5;
  const INT = [0.007, 1, 3, 7, 16, 35, 80]; // dias até a próxima revisão, por sequência de acertos
  const EXAM = Date.UTC(2027, 0, 17, 12); // prova (17/01/2027)
  let ESP = {};            // itens esperados por tópico (mapa_cobertura): setPesos()
  const META = { EXAM, pp: 0.65, ampla: 0.705, nota: "estimada pela prova anterior da Câmara (corte 117/180 PP, 127/180 ampla); outra prova, outra especialidade" };

  const atomsOf = q => (q.a && q.a.length ? q.a : ["Q:" + q.id]);
  // Campo = grupo de átomos vizinhos (q.f). Sem q.f, o campo é o próprio átomo (sem agrupamento).
  const campoOf = q => q.f || atomsOf(q)[0];
  const TW = 0.3;          // peso da transferência de um acerto para átomos irmãos do campo (só acertos)

  function build(events, Q) {
    const qm = new Map(Q.map(q => [q.id, q]));
    const A = {}, camp = new Map();
    for (const q of Q) { const c = campoOf(q); const set = camp.get(c) || camp.set(c, new Set()).get(c); atomsOf(q).forEach(a => set.add(a)); }
    const mk = a => A[a] || (A[a] = { ev: [], tr: [], streak: 0, last: 0, n: 0, ok: 0 });
    // Em branco conta como lacuna leve (não sabia); palpite acertado vale metade e não avança a sequência;
    // erro com certeza vale 1,5x (é o que anula acerto na prova).
    const ev = events.filter(e => e.ok === true || e.ok === false || (e.ok === null && e.r === "B")).sort((a, b) => a.t - b.t);

function compose(b,size){
 const W=WT[b],tot=Object.values(W).reduce((x,y)=>x+y,0);
 const mods=Object.keys(W);let cnt={};let used=0;
 mods.forEach(m=>{cnt[m]=Math.floor(W[m]*size/tot);used+=cnt[m]});
 mods.slice().sort((x,y)=>(W[y]*size/tot%1)-(W[x]*size/tot%1)).forEach(m=>{if(used<size){cnt[m]++;used++}});
 let ids=[];
 for(const m of mods){
  const pool=Q.filter(q=>!S(q).m.lix&&blk(q)===b&&mod(q)===m).map(q=>({q,k:rr(q)*10+(QH[q.id]?Math.min(QH[q.id].n,3)+1:0)+Math.random()*3}));
  pool.sort((x,y)=>x.k-y.k);ids=ids.concat(pool.slice(0,cnt[m]).map(x=>x.q.id));
 }
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 return ids;
}

function topStats(){

 for(const e of ev){if(e.g==="C"){cC++;if(e.ok)cCo++}else if(e.g==="E"){eE++;if(e.ok)eEo++}}

 h+=`<section class="card"><div class="lbl">Certo × Errado</div><div class="g" style="grid-template-columns:7rem 1fr 3rem;margin-top:8px"><span>Itens certos</span>${bar(pc,1)}<span class="num">${pct(pc)}</span></div><div class="g" style="grid-template-columns:7rem 1fr 3rem;margin-top:6px"><span>Itens errados</span>${bar(pe,1)}<span class="num">${pct(pe)}</span></div><p class="nota" style="margin-top:8px">${pe+0.03<pc?`Você é mais complacente do que desconfiado: deixa passar item errado (${pct(1-pe)} de erro) mais do que rejeita item certo (${pct(1-pc)}). Na dúvida, procure o detalhe que falsifica: troca de prazo, quórum, órgão, "sempre", "exclusivamente".`:pc+0.03<pe?`Você desconfia demais: rejeita item certo (${pct(1-pc)} de erro) mais do que aceita item errado (${pct(1-pe)}). Antes de marcar Errado, localize a palavra exata que torna o item falso.`:`Os dois lados estão equilibrados, sem viés a corrigir.`}</p></section>`;
 /* 5 tempo */
 const fx=[["até 6 s",0,6e3],["6 a 10 s",6e3,1e4],["10 a 20 s",1e4,2e4],["mais de 20 s",2e4,18e4]];
 const rowsT=fx.map(([l,a,b])=>{const s=ev.filter(e=>e.ms&&e.ms>=a&&e.ms<b);return{l,n:s.length,p:s.length?s.filter(e=>e.ok).length/s.length:0}}).filter(r=>r.n>=8);
 const ms=medMs();
 if(rowsT.length>=2)h+=`<section class="card"><div class="lbl">Tempo × acerto</div>${rowsT.map(r=>`<div class="g" style="grid-template-columns:6.5rem 1fr 3rem;margin-top:6px"><span>${r.l} <span class="nota">(${r.n})</span></span>${bar(r.p,1)}<span class="num">${pct(r.p)}</span></div>`).join("")}<p class="nota" style="margin-top:8px">Mediana: ${Math.round(ms/1000)} s por item. ${Math.max(...rowsT.map(r=>r.p))-Math.min(...rowsT.map(r=>r.p))<0.1?"Demorar mais não melhora o acerto: o erro é de conteúdo, não de pressa. Em prova, não gaste tempo remoendo um item.":"Há diferença de acerto entre as faixas; veja onde está o ponto fraco."}</p></section>`;
 /* 6 ritmo e cobertura */
 const vis=Object.values(S0.by).reduce((a,o)=>a+o.seen,0),tot=Object.values(S0.by).reduce((a,o)=>a+o.n,0);
 const novos=tot-vis,porDia=Math.ceil(novos/Math.max(1,dias-14)),pd=perDay(),ks=Object.keys(pd).sort().slice(-7),med=ks.length?Math.round(ks.reduce((a,k)=>a+pd[k],0)/ks.length):0;
 h+=`<section class="card"><div class="lbl">Ritmo até a prova</div><p style="margin:8px 0 0">Faltam <b class="num">${dias}</b> dias. Vistas <b class="num">${vis}</b> de ${tot} questões; restam <b class="num">${novos}</b> inéditas.</p><p style="margin:6px 0 0">Para ver todas e ainda reservar 14 dias de revisão: <b class="num">${porDia}</b> inéditas por dia. Seu ritmo recente: <b class="num">${med}</b> por dia.</p><p class="nota" style="margin-top:6px">${med>=porDia?"Ritmo suficiente. Mantenha e use o excedente em revisão.":"Ritmo abaixo do necessário: aumente o tempo diário ou priorize os temas de maior peso."}</p></section>`;
 /* 7 estratégia de prova */
 const fr=ev.filter(e=>e.t).length;
 h+=`<section class="card"><div class="lbl">Estratégia para a prova</div><ol style="margin:8px 0 0;padding-left:1.2rem;line-height:1.5"><li>Cada erro anula um acerto: só marque quando a chance for acima de 50%. Com seu acerto médio de <b>${pct(ev.filter(e=>e.ok).length/ev.length)}</b>, quase tudo compensa marcar; deixe em branco só o que for chute total.</li><li>Faça primeiro as matérias de maior peso e maior segurança, deixe para o fim as de baixo acerto (${gain.slice(0,2).map(x=>SH[x.m]||x.m).join(", ")}).</li><li>${pe+0.03<pc?"Em item que parece certo demais, procure a pegadinha antes de marcar Certo.":"Leia o item inteiro: a pegadinha costuma estar no final da frase."}</li><li>Meta de tempo: ${ms?Math.max(10,Math.round(ms/1000)):13} s por item é o seu ritmo atual; sobra tempo para revisar os marcados.</li></ol></section>`;
 return h;
}
function vPainel(){
 const S0=stats(),M=Motor.META,R=Motor.readiness(Q.filter(q=>!S(q).m.lix),EV,now()),wk=weekly(),ch=chutes(),cz=causas(),ms=medMs();
 const cs=Object.values(cz).reduce((a,b)=>a+b,0);
 const ruim=Q.filter(q=>S(q).m.ruim),lix=Q.filter(q=>S(q).m.lix);
 const rein=Q.filter(q=>QH[q.id]&&QH[q.id].errs>=2).sort((a,b)=>QH[b.id].errs-QH[a.id].errs).slice(0,8);
 const rows=Object.values(S0.by).sort((a,b)=>a.b.localeCompare(b.b)||a.liq-b.liq);
 let h=`<section class="card"><div class="lbl">Projeção por prova</div><div class="gauge" style="margin-top:8px">${gaugeRow("P1",S0.p1,"p1",M.pp)}${gaugeRow("P2",S0.p2,"p2",M.pp)}</div><p class="nota" style="margin-top:8px">Preparo no banco inteiro (não visto vale zero): <b class="num">${pct(R.geral)}</b> · vistas ${R.vistos} de ${R.n}. Meta provisória: ${esc(M.nota)}.</p></section>
 <section class="card"><div class="lbl">Líquido por semana</div>${trendSvg(wk,M.pp)}<p class="nota">Acertos menos erros sobre o total de cada semana. Linha tracejada: meta provisória.</p></section>
 <section class="card"><div class="lbl">Por matéria</div><div class="tw"><table><thead><tr><th>Matéria</th><th>Vistas (alta incid.)</th><th class="n">Resp.</th><th class="n">Líquido</th><th class="n">Peso</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.m)} <span class="chip ${o.b==="P1"?"p1":"p2"}">${o.b}</span></td><td><div class="minibar"><i style="width:${100*o.cov1}%"></i></div></td><td class="n">${o.tot}</td><td class="n">${o.tot?pct(o.liq):"–"}</td><td class="n">${(WT[o.b]||{})[o.m]||0}</td></tr>`).join("")}</tbody></table></div><p class="nota" style="margin-top:6px">Peso: itens estimados em cada prova de 90.</p></section>
 <div class="grid2"><section class="card"><div class="lbl">Palpites</div>${ch.g+ch.s?`<p style="margin:8px 0 0">Com certeza: <b class="num">${ch.s?pct(ch.so/ch.s):"–"}</b> de acerto em ${ch.s}.<br>Palpite: <b class="num">${ch.g?pct(ch.go/ch.g):"–"}</b> em ${ch.g}.</p><p class="nota" style="margin-top:6px">Acima de 50% palpitar compensa; abaixo, deixe em branco.</p>`:`<p class="nota" style="margin-top:8px">Marque Palpite no treino quando for chutar para o site medir se compensa.</p>`}</section>
 <section class="card"><div class="lbl">Por que você erra</div>${cs?CAUSAS.map(([k,l])=>`<div class="g" style="grid-template-columns:6rem 1fr 2rem;margin-top:6px"><span>${l}</span><div class="track"><i style="width:${100*cz[k]/cs}%"></i></div><span class="num">${cz[k]}</span></div>`).join(""):`<p class="nota" style="margin-top:8px">Depois de um erro, toque na causa. Isso mostra se o problema é conteúdo, pegadinha ou leitura.</p>`}${ms?`<p class="nota" style="margin-top:8px">Tempo mediano por questão: <b class="num">${Math.round(ms/1000)} s</b>.</p>`:""}</section></div>`;
 if(rein.length)h+=`<section class="card"><div class="lbl">Mais erradas</div>${rein.map(q=>`<div class="er-item"><div class="row"><span class="chip">${esc(mod(q))}</span><span class="chip er">${QH[q.id].errs}×</span></div><p class="rule">${ruleH(q)}</p></div>`).join("")}</section>`;
 h+=`<div class="row"><button class="btn" id="bExp">Exportar meu histórico (JSON)</button><span class="nota">${ruim.length} marcadas como ruins · ${lix.length} na lixeira</span></div>`;
 if(ruim.length)h+=`<section class="card"><div class="lbl">Marcadas como ruins</div>${ruim.slice(0,30).map(q=>`<div class="er-item"><p>${esc(q.id)}: ${esc(q.e)}</p></div>`).join("")}</section>`;
 if(lix.length)h+=`<section class="card"><div class="lbl">Lixeira</div>${lix.slice(0,30).map(q=>`<div class="er-item"><p>${esc(q.id)}: ${esc(q.e)}</p><div><button class="btn sm" data-rest="${q.id}">Restaurar</button></div></div>`).join("")}</section>`;
 return h;
}
/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset;
 if(d.nav){view=d.nav;if(d.nav==="treino"&&!sess)sess=newSess({});render();window.scrollTo(0,0);return}
 if(d.st!==undefined||d.stp!==undefined){STTAB=d.st!==undefined?+d.st:(STTAB+ +d.stp+STN.length)%STN.length;lsPut("cam26stt",STTAB);render();return}
 if(d.voz){vozToggle();return}
 if(d.go!==undefined){go(JSON.parse(d.go||"{}"));return}
 if(d.ins){const a=JSON.parse(d.ins);if(a.go)go(a.go);else if(a.nav){view=a.nav;if(a.tab)errTab=a.tab;render()}return}
 if(d.r){answer(d.r);return}
 if(d.m){mark(d.m);return}
 if(d.cz){causa(d.cz);return}
 if(t.id==="bNext"){next();return}
 if(t.id==="bPal"){palp=!palp;render();return}
 if(d.tab){errTab=d.tab;cardSt=null;render();return}
 if(d.sim){const [b,n]=JSON.parse(d.sim);simStart(b,n);return}
 if(d.sa){simAns(d.sa);return}
 if(d.sg!==undefined){simGo(+d.sg);return}
 if(d.rest){const q=QM.get(d.rest);delete S(q).m.lix;S(q).u=now();persist(q.id);render();return}
 if(t.id==="bExp"){(async()=>{try{const dl=await claude.use("downloads");if(!dl){t.textContent="Download indisponível aqui";return}await dl.save({filename:"historico_camara2026.json",data:JSON.stringify({exportado:new Date().toISOString(),estado:ST,eventos:EV,simulados:SIMS},null,1)})}catch(x){}})();return}
 switch(d.a){
  case"fim":cur=null;answered=null;sess.ended=true;render();break;
  case"flip":cardSt=1;render();break;
  case"cgood":gradeCard(true);break;
  case"cbad":gradeCard(false);break;
  case"simfim":simFinish();break;
  case"simdisc":simDiscard();break;
  case"simclose":simDiscard();break;
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="fScope"){const v=t.value,f={blk:"",mod:"",top:""};if(v.startsWith("blk:"))f.blk=v.slice(4);else if(v.startsWith("mod:"))f.mod=v.slice(4);sess.f=f;cur=null;answered=null;render()}
 if(t.id==="fSkip"){SKIPDOM=t.checked;lsPut("cam26skip",SKIPDOM);cur=null;answered=null;render();return}
 if(t.id==="fMode"){sess.mode=t.value;cur=null;answered=null;render()}
 if(t.id==="fEM"){errMod=t.value;cardSt=null;render()}
});
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="SELECT")return;
 const k=e.key.toLowerCase();
 if(k==="+"||k==="="){zStep(1);return}if(k==="-"||k==="_"){zStep(-1);return}
 if(view==="treino"&&sess&&!sess.ended){
  if(!answered){if(k==="c")answer("C");else if(k==="e")answer("E");else if(k==="b")answer("B");else if(k==="p"){palp=!palp;render()}}
  else{if(k==="enter"||k===" "){e.preventDefault();next()}
   else if("1234".includes(k)&&k){const c=CAUSAS[+k-1];if(c)causa(c[0])}
   else{const m={d:"dif",v:"rev",r:"ruim",x:"lix"}[k];if(m)mark(m)}}
 }else if(view==="sim"&&SIM&&!SIM.done){
  if(k==="c")simAns("C");else if(k==="e")simAns("E");else if(k==="arrowright"||k==="n")simGo(SIM.i+1);else if(k==="arrowleft"||k==="p")simGo(SIM.i-1);
 }
});
const ZS=[0.9,1,1.15,1.3,1.5,1.75,2.1];
let zi=(()=>{try{const v=parseFloat(localStorage.getItem("camara.zoom"));const i=ZS.indexOf(v);return i<0?1:i}catch(e){return 1}})();
function zApply(){
 document.documentElement.style.setProperty("--z",ZS[zi]);
 const l=document.getElementById("zLbl"),a=document.getElementById("zMinus"),b=document.getElementById("zPlus");
 if(l)l.textContent=Math.round(ZS[zi]*100)+"%";if(a)a.disabled=zi===0;if(b)b.disabled=zi===ZS.length-1;
 try{localStorage.setItem("camara.zoom",String(ZS[zi]))}catch(e){}
}
function zStep(d){const n=Math.max(0,Math.min(ZS.length-1,zi+d));if(n!==zi){zi=n;zApply()}}
zApply();
