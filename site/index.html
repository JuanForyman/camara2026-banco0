<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171a;--card:#1a1f23;--fg:#e5e8ea;--mut:#98a3a9;--line:#2b3338;--acc:#86b6e3;--accbg:#1f2e3b;--ok:#7fc494;--okbg:#1c2d22;--err:#e89191;--errbg:#33201f;--warn:#d9b45e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171a;--card:#1a1f23;--fg:#e5e8ea;--mut:#98a3a9;--line:#2b3338;--acc:#86b6e3;--accbg:#1f2e3b;--ok:#7fc494;--okbg:#1c2d22;--err:#e89191;--errbg:#33201f;--warn:#d9b45e;color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0}

<script>
/* Motor de estudo v2 (puro, sem DOM): v1 + campos (famílias de átomos vizinhos). Usado pelo site e por scripts.
   Entrada: eventos {q, ok(true|false|null), t(ms)} e questões {id,t,a[],g}.
   Unidade de conhecimento: átomo (artigo). Questão sem átomo vira átomo próprio "Q:<id>". */
(function (root) {
  const DAY = 864e5;
  const INT = [0.007, 1, 3, 7, 16, 35, 80]; // dias até a próxima revisão, por sequência de acertos
  const META = { pp: 0.65, ampla: 0.705, nota: "estimada pela prova anterior da Câmara (corte 117/180 PP, 127/180 ampla); outra prova, outra especialidade" };

  const atomsOf = q => (q.a && q.a.length ? q.a : ["Q:" + q.id]);
  // Campo = grupo de átomos vizinhos (q.f). Sem q.f, o campo é o próprio átomo (sem agrupamento).
  const campoOf = q => q.f || atomsOf(q)[0];
  const TW = 0.3;          // peso da transferência de um acerto para átomos irmãos do campo (só acertos)

  function build(events, Q) {
    const qm = new Map(Q.map(q => [q.id, q]));
    const A = {}, camp = new Map();
    for (const q of Q) { const c = campoOf(q); const set = camp.get(c) || camp.set(c, new Set()).get(c); atomsOf(q).forEach(a => set.add(a)); }
    const mk = a => A[a] || (A[a] = { ev: [], tr: [], streak: 0, last: 0, n: 0, ok: 0 });
    const ev = events.filter(e => e.ok === true || e.ok === false).sort((a, b) => a.t - b.t);
    for (const e of ev) {
      const q = qm.get(e.q); if (!q) continue;
      atomsOf(q).forEach((a, i) => {
        const x = mk(a);
        const w = i === 0 ? 1 : 0.5;
        x.ev.push([e.t, e.ok ? 1 : 0, w]); x.n += w;
        if (e.ok) { x.ok += w; x.streak++; } else x.streak = 0;
        x.last = e.t;
      });
      if (e.ok === true) { // transferência parcial: acerto vale um pouco para os irmãos; erro não reduz nada
        const own = new Set(atomsOf(q));
        for (const a of camp.get(campoOf(q)) || []) if (!own.has(a)) mk(a).tr.push([e.t, TW]);
      }
    }
    return A;
  }

  // Probabilidade de acerto: Beta(1,1) com evidência que esmaece (meia-vida 60 dias).
  // Regra do teto: menos de 2 respostas -> no máximo 0,75.
  function pAtom(x, t) {
    if (!x || !x.n) return { p: 0.5, neff: 0 };
    let s = 1, f = 1, ne = 0;
    for (const [te, w] of x.tr || []) s += w * Math.pow(0.5, (t - te) / DAY / 60);
    for (const [te, ok, w] of x.ev) {
      const ww = w * Math.pow(0.5, (t - te) / DAY / 60);
      ne += ww; if (ok) s += ww; else f += ww;
    }
    let p = s / (s + f);
    if (x.n < 2) p = Math.min(p, 0.75);
    return { p, neff: ne };
  }

  function urgency(x, t) { // >=1 significa vencido
    if (!x || !x.n) return 0;
    return (t - x.last) / DAY / INT[Math.min(x.streak, INT.length - 1)];
  }

  function priority(x, t, cov) {
    if (!x || !x.n) { // novo: mais valioso em tópico pouco coberto; menos se um irmão do campo já foi acertado
      let tr = 0; for (const [te, w] of (x && x.tr) || []) tr += w * Math.pow(0.5, (t - te) / DAY / 30);
      return 0.45 * (1 + (1 - cov)) * (1 - 0.4 * Math.min(1, tr / 0.6));
    }
    const { p } = pAtom(x, t), u = urgency(x, t);
    if (x.streak === 0) return 0.6 + (1 - p); // errou por último: outra questão do mesmo artigo logo
    return Math.max(0.02, (1 - p) * (0.6 + 0.4 * Math.min(u, 3)) + (u >= 1 ? 0.35 : -0.25 * (1 - u)));
  }

  function motivo(x, t) {
    if (!x || !x.n) return "nova";
    const u = urgency(x, t), { p } = pAtom(x, t);
    if (x.streak === 0) return "você errou por último";
    if (u >= 1) return "revisão vencida";
    return p < 0.6 ? "ponto fraco" : "reforço";
  }

  function coverage(Q, A) {
    const c = {};
    for (const q of Q) { const k = q.t, o = c[k] || (c[k] = { n: 0, v: 0 }); o.n++; if (A[atomsOf(q)[0]] && A[atomsOf(q)[0]].n) o.v++; }
    return c;
  }

  // Estado de cada campo. dominado: >=4 respostas e >=3 questões distintas nos últimos 90 dias, p>=0,8 e ao menos
  // um acerto em item Errado (isca), se o campo tiver algum. lacuna: algum átomo errado por último.
  function campos(Q, events, t) {
    const qm = new Map(Q.map(q => [q.id, q])), out = {};
    for (const q of Q) { const c = campoOf(q), o = out[c] || (out[c] = { id: c, n: Q.length && 0, atomos: new Set(), qs: new Set(), temE: false, ev: [], status: "novo", p: 0.5 }); atomsOf(q).forEach(a => o.atomos.add(a)); o.temE = o.temE || q.g === "E"; o.t = o.t || q.t; }
    for (const e of events.filter(e => e.ok === true || e.ok === false).sort((a, b) => a.t - b.t)) {
      const q = qm.get(e.q); if (!q) continue; const o = out[campoOf(q)]; o.ev.push({ t: e.t, ok: e.ok, q: q.id, g: q.g });
    }
    const A = build(events, Q);
    for (const o of Object.values(out)) {
      let s = 1, f = 1; const rec = o.ev.filter(e => t - e.t <= 90 * DAY);
      for (const e of o.ev) { const w = Math.pow(0.5, (t - e.t) / DAY / 60); if (e.ok) s += w; else f += w; }
      o.p = s / (s + f); o.resp = o.ev.length; o.atomos = [...o.atomos];
      const lacuna = o.atomos.some(a => A[a] && A[a].n && A[a].streak === 0);
      const qs = new Set(rec.map(e => e.q)), acE = rec.some(e => e.ok && e.g === "E");
      const ult = rec.slice(-4).filter(e => e.ok).length;
      if (!o.resp) o.status = "novo";
      else if (lacuna) o.status = "lacuna";
      else if (rec.length >= 4 && qs.size >= 3 && ult >= 4 - 0 && o.p >= 0.8 && (acE || !o.temE)) o.status = "dominado";
      else o.status = "em andamento";
      delete o.ev; delete o.qs;
    }
    return out;
  }

  const RW = { 1: 1, 2: 0.55, 3: 0.15 }; // peso por relevância de prova
  // Escolhe a próxima questão. allowed: lista de questões elegíveis (já sem lixeira e com filtro).
  function pick(allowed, events, t, rnd) {
    rnd = rnd || Math.random;
    if (!allowed.length) return null;
    const A = build(events, allowed), cov = coverage(allowed, A);
    const byAtom = new Map();
    for (const q of allowed) for (const a of atomsOf(q)) { (byAtom.get(a) || byAtom.set(a, []).get(a)).push(q); }
    const last = {}; // última vez que cada questão apareceu
    for (const e of events) last[e.q] = Math.max(last[e.q] || 0, e.t);
    // quarentena: campo respondido nas últimas 3 respostas pesa 0,1; nas últimas 10, 0,4 (atomo errado por último: 0,6 / 0,9)
    const qm = new Map(allowed.map(q => [q.id, q])), recent = new Map();
    const ord = events.filter(e => qm.has(e.q)).sort((u, v) => v.t - u.t);
    ord.forEach((e, i) => { const c = campoOf(qm.get(e.q)); if (!recent.has(c)) recent.set(c, i); });
    const CS = campos(allowed, events, t);
    const cand = [];
    for (const [a, qs] of byAtom) {
      const top = qs[0].t, c = cov[top] ? cov[top].v / cov[top].n : 0, cp = campoOf(qs[0]), x = A[a];
      let pr = priority(x, t, c), i = recent.has(cp) ? recent.get(cp) : 99;
      const err = x && x.n && x.streak === 0;
      if (i < 3) pr *= err ? 0.6 : 0.1; else if (i < 10) pr *= err ? 0.9 : 0.4;
      if ((!x || !x.n) && CS[cp] && CS[cp].status === "dominado") pr *= 0.4; // terreno dominado: o novo espera
      const rr = Math.min(...qs.map(q => q.r || 1)); pr *= RW[rr] || 1; // relevância de prova (q.r)
      cand.push({ a, qs, pr, x, cp });
    }
    cand.sort((u, v) => v.pr - u.pr);
    const top = cand.slice(0, 6), wsum = top.reduce((s, c) => s + c.pr * c.pr, 0);
    let r = rnd() * wsum, ch = top[0];
    for (const c of top) { r -= c.pr * c.pr; if (r <= 0) { ch = c; break; } }
    const qs = ch.qs.slice().sort((a, b) => ((a.r || 1) - (b.r || 1)) * 1e14 + (last[a.id] || 0) - (last[b.id] || 0) + (rnd() - 0.5) * 1e3);
    return { q: qs[0], motivo: motivo(ch.x, t), atomo: ch.a, campo: ch.cp, prioridade: ch.pr };
  }

  // Aproveitamento líquido esperado (acerto − erro), por tópico e geral. Não visto vale 0.
  function readiness(Q, events, t) {
    const A = build(events, Q), out = { topicos: {}, geral: 0, vistos: 0, n: Q.length };
    let soma = 0;
    for (const q of Q) {
      const a = atomsOf(q)[0], x = A[a], p = pAtom(x, t).p;
      const ev = x && x.n ? Math.max(0, 2 * p - 1) : 0;
      const k = out.topicos[q.t] || (out.topicos[q.t] = { n: 0, v: 0, liq: 0 });
      k.n++; k.liq += ev; if (x && x.n) { k.v++; out.vistos++; }
      soma += ev;
    }
    out.geral = Q.length ? soma / Q.length : 0;
    for (const k of Object.values(out.topicos)) k.liq = k.n ? k.liq / k.n : 0;
    return out;
  }

  // Átomos mais prioritários agora (para o painel)
  function fila(Q, events, t, n) {
    const A = build(events, Q), cov = coverage(Q, A), seen = new Map();
    for (const q of Q) for (const a of atomsOf(q)) if (!seen.has(a)) seen.set(a, q);
    return [...seen].map(([a, q]) => {
      const c = cov[q.t] ? cov[q.t].v / cov[q.t].n : 0;
      return { a, t: q.t, pr: priority(A[a], t, c), motivo: motivo(A[a], t), p: pAtom(A[a], t).p };
    }).sort((u, v) => v.pr - u.pr).slice(0, n || 8);
  }

  const api = { build, pAtom, urgency, priority, pick, readiness, fila, coverage, campos, campoOf, atomsOf, META, INT, DAY, TW };
  if (typeof module !== "undefined") module.exports = api; else root.Motor = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
const $=id=>document.getElementById(id);
const LS="cam26v0";const DAY=864e5;const BOX=[0,1,3,7,16,35,80];
let why="",Q=[],ART={},TOP={},CAMPO={},ST={},EV=[],DB=null,UID=null,cur=null,answered=null,view="treino",filt="",saveQ=Promise.resolve();
const now=()=>Date.now();
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsPut(){try{localStorage.setItem(LS,JSON.stringify({ST,EV:EV.slice(-3000)}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
async function load(){
 const [b,a,t,cm]=await Promise.all(["banco","artigos","topicos","campos"].map(n=>fetch(n+".json").then(r=>r.json()).catch(()=>({}))));
 Q=b;ART=a;TOP=t;CAMPO=cm||{};
 const l=lsGet();if(l){ST=l.ST||{};EV=l.EV||[]}
 draw();
 try{const c=await claude.use("db");const u=await claude.use("user");
  if(c){DB=c;UID=u?await u.id():null;
   const s=await DB.collection("estado").limit(1000).get();
   s.docs.forEach(d=>{const x=d.data();if(x&&(!ST[d.id]||(x.u||0)>(ST[d.id].u||0)))ST[d.id]=x});
   try{const es=await DB.collection("eventos").orderBy("t","desc").limit(1000).get();
    const key=e=>e.q+"|"+e.t,have=new Set(EV.map(key));
    es.docs.forEach(d=>{const x=d.data();if(x&&x.q&&!have.has(key(x))){EV.push(x);have.add(key(x))}});
    EV.sort((a,b)=>a.t-b.t)}catch(e){}
   lsPut();if(!answered)draw()}}catch(e){}
}
function persist(qid,ev){
 lsPut();
 if(!DB)return;
 saveQ=saveQ.then(async()=>{try{await DB.doc("estado/"+qid).set(ST[qid]);if(ev)await DB.collection("eventos").add(ev)}catch(e){}});
}
const S=q=>ST[q.id]||(ST[q.id]={n:0,ok:0,box:0,due:0,m:{}});
function pool(){return Q.filter(q=>(!filt||q.t===filt||q.t.startsWith(filt+".")) && !(S(q).m.lix))}
function pick(){
 const r=Motor.pick(pool(),EV,now());
 why=r?r.motivo:"";return r?r.q:null}
function answer(r){ // r: C | E | B
 if(!cur||answered)return;
 const s=S(cur);const t=now();
 const acertou=r===cur.g,branco=r==="B";
 s.n++;s.last=t;s.u=t;if(acertou)s.ok++;
 if(s.m.rev)delete s.m.rev;
 answered={r,acertou,branco};
 const ev={q:cur.id,r,g:cur.g,ok:branco?null:acertou,t,top:cur.t};EV.push(ev);
 persist(cur.id,ev);draw();
}
function mark(k){
 if(!cur||!answered)return;
 const s=S(cur);s.m[k]=!s.m[k];if(!s.m[k])delete s.m[k];
  s.u=now();persist(cur.id);
 if(k==="lix"&&s.m.lix){next();return}
 draw();
}
function next(){cur=pick();answered=null;draw();window.scrollTo(0,0)}
function artHtml(q){
 return q.a.map(id=>{const a=ART[id];if(!a)return"";return`<h4>${esc(a.t)}</h4>`+a.x.map(l=>`<p>${esc(l)}</p>`).join("")}).join("")||`<p>Sem texto de artigo vinculado (${esc(q.c)}).</p>`;
}
const MK=[["boa","Boa","g"],["ruim","Ruim","r"],["dif","Difícil","d"],["rev","Rever","v"],["lix","Lixeira","x"]];
function drawTreino(){
 if(!cur)cur=pick();
 if(!cur){$("main").innerHTML='<div class="vazio">Nenhuma questão neste filtro.</div>';return}
 const s=S(cur),hoje=EV.filter(e=>now()-e.t<DAY&&e.ok!==undefined),ac=hoje.filter(e=>e.ok).length;
 let h=`<div class="top"><span>hoje <b>${hoje.length}</b> respondidas</span><span>acertos <b>${ac}</b></span><span>no banco <b>${pool().length}</b></span></div>`;
 h+=`<div class="q"><div class="crumb">${esc((TOP[cur.t]||{}).m||"")} <span>›</span> ${esc((TOP[cur.t]||{}).t||cur.t)}${cur.f&&CAMPO[cur.f]?` <span>›</span> <em>${esc(CAMPO[cur.f])}</em>`:""}</div>
 <div class="meta"><span>${esc(cur.id)}</span><span>${why?esc(why):""}</span>${s.n?`<span>vista ${s.n}×</span>`:""}</div>
 <p class="enun" style="margin-top:12px">${esc(cur.e)}</p>`;
 if(!answered){h+=`<div class="resp"><button data-r="C">Certo<small>C</small></button><button data-r="E">Errado<small>E</small></button><button class="br" data-r="B">Em branco<small>B</small></button></div>`}
 else{
  const a=answered,cls=a.branco?"bl":a.acertou?"ok":"no";
  const msg=a.branco?"Em branco":a.acertou?"Você acertou":"Você errou";
  h+=`<div class="res ${cls}"><div><b>${msg}.</b> Gabarito: <b>${cur.g==="C"?"Certo":"Errado"}</b></div><p class="com">${esc(cur.c)}</p></div>
  <details class="mais"><summary>Saiba mais: texto do artigo</summary><div class="art">${artHtml(cur)}</div></details>
  <div class="marks" role="group" aria-label="Marcações">${MK.map(([k,l,key])=>`<button data-m="${k}" aria-pressed="${!!S(cur).m[k]}">${l}<kbd>${key}</kbd></button>`).join("")}</div>
  <div class="prox"><button id="bNext">Próxima <span style="opacity:.7;font-family:var(--f-mono);font-size:.75rem">Enter</span></button></div>`}
 h+="</div>";
 $("main").innerHTML=h;
 $("main").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>answer(b.dataset.r));
 $("main").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>mark(b.dataset.m));
 const bn=$("bNext");if(bn){bn.onclick=next;bn.focus({preventScroll:true})}
}
function drawPainel(){
 const P=Q.filter(q=>!S(q).m.lix),R=Motor.readiness(P,EV,now()),F=Motor.fila(P,EV,now(),8);
 const ruim=Q.filter(q=>S(q).m.ruim),lix=Q.filter(q=>S(q).m.lix),rev=Q.filter(q=>S(q).m.rev);
 const pct=x=>Math.round(100*x)+"%",m=Motor.META;
 let h=`<div class="q" style="padding:16px 18px"><div class="meta">Preparo líquido nos itens do banco (acertos menos erros)</div>
 <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px"><span style="font:600 2rem var(--f-disp)">${pct(R.geral)}</span><span class="nota">meta provisória ${pct(m.pp)} (lista PP) · ${pct(m.ampla)} (ampla)</span></div>
 <div class="bar" style="height:10px;margin-top:10px;position:relative"><i style="width:${Math.min(100,100*R.geral)}%"></i><u style="position:absolute;left:${100*m.pp}%;top:-3px;bottom:-3px;width:2px;background:var(--warn);border:0"></u></div>
 <p class="nota" style="margin-top:8px">Itens não vistos contam zero. Vistos: ${R.vistos} de ${R.n}. A meta vem de outra prova da Câmara (corte 117/180 PP, 127/180 ampla) e de outra especialidade; é só referência até o edital 2026 ter resultado.</p></div>
 <div class="tw"><table><thead><tr><th>Tópico</th><th class="n">Itens</th><th>Vistos</th><th class="n">Líquido</th></tr></thead><tbody>`;
 Object.keys(R.topicos).sort().forEach(k=>{const x=R.topicos[k],T=TOP[k]||{};h+=`<tr><td>${esc(T.t||k)}<div style="font:.7rem var(--f-mono);color:var(--mut)">${esc(T.m||"")} · ${k}</div></td><td class="n">${x.n}</td><td><div class="bar"><i style="width:${100*x.v/x.n}%"></i></div></td><td class="n">${pct(x.liq)}</td></tr>`});
 h+=`</tbody></table></div>
 <div class="tw"><table><thead><tr><th>Próximos artigos que o motor vai priorizar</th><th>Motivo</th><th class="n">Acerto est.</th></tr></thead><tbody>${F.map(f=>`<tr><td>${esc((ART[f.a]||{}).t||f.a)}</td><td>${esc(f.motivo)}</td><td class="n">${pct(f.p)}</td></tr>`).join("")}</tbody></table></div>`;
 const CS=Motor.campos(P,EV,now()),CL=Object.values(CS).filter(c=>CAMPO[c.id]&&c.status!=="novo").sort((u,v)=>({lacuna:0,"em andamento":1,dominado:2}[u.status]-{lacuna:0,"em andamento":1,dominado:2}[v.status])||u.p-v.p);
 const nd=Object.values(CS).filter(c=>c.status==="dominado").length;
 h+=`<div class="tw"><table><thead><tr><th>Campos que o motor acompanha (${nd} dominados)</th><th>Situação</th><th class="n">Respostas</th><th class="n">Acerto est.</th></tr></thead><tbody>${CL.length?CL.map(c=>`<tr><td>${esc(CAMPO[c.id])}</td><td>${c.status==="dominado"?"dominado: só revisão espaçada":c.status==="lacuna"?"lacuna: tem erro aberto":"em andamento"}</td><td class="n">${c.resp}</td><td class="n">${pct(c.p)}</td></tr>`).join(""):`<tr><td colspan="4">Responda algumas questões para o motor mapear os campos.</td></tr>`}</tbody></table></div>
 <p class="nota">Campo = grupo de artigos vizinhos. Acertar um item dá crédito parcial aos irmãos; errar não tira nada deles, mas abre lacuna no campo. O campo só é dado como dominado com 4+ respostas, 3+ questões diferentes, ao menos um item Errado acertado e sem erro aberto.</p>`;
 h+=`<div class="tool"><button class="btn" id="bExp">Exportar meu histórico (JSON)</button><span class="nota">${rev.length} para rever · ${ruim.length} ruins · ${lix.length} na lixeira</span></div>`;
 if(ruim.length)h+=`<div class="lix"><b>Marcadas como ruins</b>${ruim.map(q=>`<div><span>${esc(q.id)}: ${esc(q.e)}</span></div>`).join("")}</div>`;
 if(lix.length)h+=`<div class="lix"><b>Lixeira</b>${lix.map(q=>`<div><span>${esc(q.id)}: ${esc(q.e)}</span><button class="btn" data-rest="${q.id}">Restaurar</button></div>`).join("")}</div>`;
 $("main").innerHTML=h;
 $("main").querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>{const q=Q.find(x=>x.id===b.dataset.rest);delete S(q).m.lix;S(q).u=now();persist(q.id);draw()});
 const be=$("bExp");be.onclick=async()=>{try{const d=await claude.use("downloads");if(!d){be.textContent="Download indisponível aqui";return}
  await d.save({filename:"historico_camara2026.json",data:JSON.stringify({exportado:new Date().toISOString(),estado:ST,eventos:EV},null,1)})}catch(e){}};
}
function draw(){
 $("nTreino").setAttribute("aria-current",view==="treino");$("nPainel").setAttribute("aria-current",view==="painel");
 if(!Q.length)return;
 if(view==="treino")drawTreino();else drawPainel();
}
$("nTreino").onclick=()=>{view="treino";draw()};
$("nPainel").onclick=()=>{view="painel";draw()};
$("fTop").onchange=e=>{filt=e.target.value;cur=null;answered=null;draw()};
document.addEventListener("keydown",e=>{
 if(view!=="treino"||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="SELECT")return;
 const k=e.key.toLowerCase();
 if(!answered){if(k==="c")answer("C");else if(k==="e")answer("E");else if(k==="b")answer("B")}
 else{if(k==="enter"||k===" "){e.preventDefault();next()}
  else{const m=MK.find(x=>x[2]===k);if(m)mark(m[0])}}
});
load().then(()=>{
 const ts=[...new Set(Q.map(q=>q.t))].sort();
 $("fTop").innerHTML='<option value="">Todos os tópicos</option>'+ts.map(t=>`<option value="${t}">${esc(((TOP[t]||{}).t||t).slice(0,58))}</option>`).join("");
}).catch(e=>{$("main").innerHTML='<div class="vazio">Erro ao carregar o banco: '+esc(e.message)+'</div>'});
</script>
