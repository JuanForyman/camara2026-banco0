<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Treino Câmara 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho fixo com 5 abas; uma coluna de leitura (máx. 780px). Hoje = contagem regressiva + próxima ação; Treino = questão; Erros = caderno; Simulado = prova; Painel = números. */
:root{
 --bg:#eef1ef;--card:#fbfcfb;--fg:#12201d;--mut:#5a6a65;--line:#d2d9d5;
 --acc:#0a6b53;--accfg:#ffffff;--accbg:#dcece5;
 --ok:#1f7a3f;--okbg:#dff0e3;--err:#b03030;--errbg:#f7e1de;--warn:#8a5d00;--warnbg:#f5e8c6;
 --p1:#2b5d9c;--p2:#7a4a9a;
 --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-ui:'Public Sans',system-ui,-apple-system,sans-serif;--f-read:'Source Serif 4',Georgia,serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1412;--card:#151e1b;--fg:#e4ebe8;--mut:#92a39d;--line:#263430;--acc:#4cc9a0;--accfg:#06201a;--accbg:#173028;--ok:#6fcb8a;--okbg:#17301f;--err:#f08a82;--errbg:#35201e;--warn:#e0b960;--warnbg:#332a12;--p1:#7faee8;--p2:#c09be0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1412;--card:#151e1b;--fg:#e4ebe8;--mut:#92a39d;--line:#263430;--acc:#4cc9a0;--accfg:#06201a;--accbg:#173028;--ok:#6fcb8a;--okbg:#17301f;--err:#f08a82;--errbg:#35201e;--warn:#e0b960;--warnbg:#332a12;--p1:#7faee8;--p2:#c09be0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%;min-width:0;color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:8px}
.brand{font:800 1.05rem var(--f-disp);letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--acc)}
nav{display:flex;gap:2px;min-width:0}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 9px;color:var(--mut);font-weight:500;position:relative}
nav button[aria-current="true"]{color:var(--fg);border-color:var(--acc);font-weight:600}
nav button .dot{position:absolute;top:-3px;right:-7px;min-width:17px;height:17px;border-radius:9px;background:var(--err);color:#fff;font:600 .65rem/17px var(--f-mono);text-align:center;padding:0 4px}
main{max-width:780px;margin:0 auto;padding-block:18px 56px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.card.flat{background:none}
.lbl{font:500 .7rem var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.btn.big{padding:14px 26px;font:700 1.05rem var(--f-disp)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.78rem;color:var(--mut);white-space:nowrap}
.chip.p1{color:var(--p1);border-color:var(--p1)}.chip.p2{color:var(--p2);border-color:var(--p2)}
.chip.er{color:var(--err);border-color:var(--err)}.chip.wn{color:var(--warn);border-color:var(--warn)}.chip.gd{color:var(--ok);border-color:var(--ok)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.nota{font-size:.82rem;color:var(--mut);margin:0;max-width:68ch}
.vazio{padding:28px 8px;text-align:center;color:var(--mut)}
/* Hoje */
.hero{display:grid;gap:16px}
.count{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count b{font:800 clamp(3.2rem,14vw,5.4rem)/0.9 var(--f-disp);letter-spacing:-.04em}
.count span{color:var(--mut);max-width:26ch}
.gauge{display:grid;gap:10px}
.g{display:grid;grid-template-columns:2.2rem 1fr 3.4rem;gap:8px;align-items:center;font-size:.85rem}
.track{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:visible}
.track i{display:block;height:100%;border-radius:6px;background:var(--acc)}
.track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn);text-decoration:none}
.track.p1 i{background:var(--p1)}.track.p2 i{background:var(--p2)}
.radar{display:grid;gap:8px}
.ins{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.ins.er{border-color:var(--err);background:var(--errbg)}.ins.wn{border-color:var(--warn);background:var(--warnbg)}.ins.gd{border-color:var(--ok);background:var(--okbg)}
.ins .i{font:700 .7rem var(--f-mono);letter-spacing:.06em}
.foco{display:grid;gap:8px}
.foco div.f{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.foco div.f:first-child{border-top:0}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--line);display:block}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--acc) 30%,var(--line))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--acc) 55%,var(--line))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--acc) 80%,var(--line))}
.heat i[data-l="4"]{background:var(--acc)}
/* Treino */
.sbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;font:.8rem var(--f-mono);color:var(--mut)}
.sbar b{color:var(--fg);font-weight:500}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.crumb{font:600 .8rem var(--f-ui);color:var(--acc);display:flex;flex-wrap:wrap;gap:2px 6px}
.crumb span{color:var(--mut)}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;font:.72rem var(--f-mono);color:var(--mut)}
.enun{font:400 1.28rem/1.6 var(--f-read);margin:14px 0 0;text-wrap:pretty}
.resp{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.resp button{flex:1 1 120px;padding:13px 14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-weight:600}
.resp button:hover{border-color:var(--acc)}
.resp button small{font:400 .72rem var(--f-mono);color:var(--mut);margin-left:6px}
.resp .br{flex:0 1 110px;font-weight:400;color:var(--mut)}
.pal{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
.pal button{background:none;border:1px solid var(--line);border-radius:99px;padding:2px 12px;color:var(--mut)}
.pal button[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warnbg);font-weight:600}
.res{margin-top:18px;padding:12px 14px;border-radius:6px;display:grid;gap:6px}
.res.ok{background:var(--okbg)}.res.no{background:var(--errbg)}.res.bl{background:var(--accbg)}
.res .v{font-weight:600}.res.ok .v{color:var(--ok)}.res.no .v{color:var(--err)}
.com{margin:0;font-size:1rem}
.caus{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--mut)}
.caus button{background:none;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--fg)}
.caus button[aria-pressed="true"]{background:var(--err);border-color:var(--err);color:#fff}
details.mais{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;color:var(--acc);font-size:.9rem}
.art{margin-top:8px;font:.95rem/1.6 var(--f-read);display:grid;gap:4px}
.art h4{margin:8px 0 2px;font:500 .75rem var(--f-mono);color:var(--mut)}
.art p{margin:0}.art .cab{color:var(--mut);font-size:.9rem}
.art .sel{border-left:3px solid var(--acc);padding-left:10px;font-weight:600}
details.full{margin-top:10px}details.full summary{color:var(--mut);font-size:.85rem}
.marks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:.8rem}
.marks button{background:none;border:0;padding:2px 0;color:var(--mut);border-bottom:1px dotted transparent}
.marks button[aria-pressed="true"]{color:var(--acc);font-weight:600;border-bottom-color:var(--acc)}
.marks kbd,.resp kbd{font:.68rem var(--f-mono);opacity:.7;margin-left:3px}
.prox{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* Erros */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;color:var(--mut)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.er-item{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.er-item:first-child{border-top:0}
.er-item p{margin:0}
.er-item .rule{font-size:.88rem;color:var(--mut)}
.cardf{min-height:170px;display:grid;align-content:center;gap:10px;text-align:left}
.cardf h3{font-size:1.5rem}
/* Simulado */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.sim-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:4px;font:.72rem var(--f-mono);padding:0}
.sim-grid button[data-s="C"],.sim-grid button[data-s="E"]{background:var(--accbg);border-color:var(--acc)}
.sim-grid button[data-s="B"]{background:var(--warnbg);border-color:var(--warn)}
.sim-grid button[aria-current="true"]{outline:2px solid var(--fg)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:500 .68rem var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.minibar{height:6px;background:var(--line);border-radius:3px;min-width:60px;position:relative}
.minibar i{display:block;height:100%;background:var(--acc);border-radius:3px}
svg{display:block;max-width:460px}
svg text{fill:var(--mut);font:8px var(--f-mono)}
svg .ln{stroke:var(--acc);fill:none;stroke-width:2}
svg .ar{fill:color-mix(in srgb,var(--acc) 18%,transparent)}
svg .mt{stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1}
svg .gd{stroke:var(--line);stroke-width:1}
svg .pt{fill:var(--acc)}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s}}
</style>
<header><div class="bar-in"><span class="brand">Câmara <i>26</i></span>
<nav id="nav"></nav></div></header>
<main id="app"><div class="vazio">Carregando banco…</div></main>
<script>
<!--MOTOR-->
</script>
<script>
const $=id=>document.getElementById(id);
const DAY=864e5,EXAM=new Date(2027,0,17,8,0,0).getTime();
const LS="cam26v0",LSIM="cam26sim",LSIMS="cam26sims";
const LAD=[1,3,7,16],CAD=[2,5,12,30];
const SH={"Língua Portuguesa":"Português","Língua Inglesa":"Inglês","Noções de Direito Constitucional e de Regimento Interno da Câmara":"Const. e RI","Noções de Direito Administrativo e Administração Pública":"Administrativo","Tecnologia da Informação e Dados":"TI e Dados","Processo Legislativo, RICD e Regimento Comum":"Proc. Legislativo","Linguística":"Linguística","Ciência Política":"Ciência Política","Reconhecimento de Fala, Transcrição e IA":"Fala e IA"};
/* distribuição estimada dos 90 itens de cada prova; ajuste aqui se o edital detalhar */
const WT={P1:{"Português":25,"Inglês":10,"Const. e RI":20,"Administrativo":25,"TI e Dados":10},P2:{"Proc. Legislativo":35,"Linguística":20,"Ciência Política":20,"Fala e IA":15}};
const CAUSAS=[["nao","Não sabia"],["peg","Pegadinha"],["mal","Li mal"],["chu","Chutei"]];
let Q=[],QM=new Map(),ART={},TOP={},CAMPO={},ST={},EV=[],SIMS=[],DB=null,UID=null;
let view="hoje",sess=null,cur=null,answered=null,why="",tq0=0,palp=false,QH={},SIM=null,simSel=null,errTab="venc",errMod="",cardSt=null,saveQ=Promise.resolve();
const now=()=>Date.now();
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pct=x=>Math.round(100*x)+"%";
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const rel=t=>{const d=Math.round((sod(t)-sod(now()))/DAY);return d<=0?"hoje":d===1?"amanhã":"em "+d+" dias"};
const mod=q=>SH[(TOP[q.t]||{}).m]||"Outras";
const blk=q=>(TOP[q.t]||{}).b||"P1";
const rr=q=>q.r||1;
/* ---------- persistência ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsPut(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveLocal(){lsPut(LS,{ST,EV:EV.slice(-4000)})}
function persist(qid,ev){saveLocal();if(!DB)return;saveQ=saveQ.then(async()=>{try{await DB.doc("estado/"+qid).set(ST[qid]);if(ev)await DB.collection("eventos").add(ev)}catch(e){}})}
const S=q=>ST[q.id]||(ST[q.id]={n:0,ok:0,box:0,due:0,m:{}});
async function load(){
 const [b,a,t,cm]=await Promise.all(["banco","artigos","topicos","campos"].map(n=>fetch(n+".json").then(r=>r.json()).catch(()=>({}))));
 Q=b;ART=a;TOP=t;CAMPO=cm||{};QM=new Map(Q.map(q=>[q.id,q]));
 const l=lsGet(LS);if(l){ST=l.ST||{};EV=l.EV||[]}
 SIMS=lsGet(LSIMS)||[];SIM=lsGet(LSIM);
 rebuild();render();
 try{const c=await claude.use("db");const u=await claude.use("user");
  if(c){DB=c;UID=u?await u.id():null;
   const s=await DB.collection("estado").limit(2000).get();
   s.docs.forEach(d=>{const x=d.data();if(x&&(!ST[d.id]||(x.u||0)>(ST[d.id].u||0)))ST[d.id]=x});
   try{const es=await DB.collection("eventos").orderBy("t","desc").limit(3000).get();
    const key=e=>e.q+"|"+e.t,have=new Set(EV.map(key));
    es.docs.forEach(d=>{const x=d.data();if(x&&x.q&&!have.has(key(x))){EV.push(x);have.add(key(x))}});
    EV.sort((a,b)=>a.t-b.t)}catch(e){}
   try{const ss=await DB.collection("simulados").limit(100).get();const have=new Set(SIMS.map(s=>s.id));ss.docs.forEach(d=>{const x=d.data();if(x&&!have.has(x.id))SIMS.push(x)});SIMS.sort((a,b)=>a.t-b.t);lsPut(LSIMS,SIMS)}catch(e){}
   saveLocal();rebuild();if(!answered&&!(view==="sim"&&SIM&&!SIM.done))render()}}catch(e){}
}
/* ---------- histórico por questão ---------- */
function rebuild(){
 QH={};
 for(const e of EV){if(e.ok!==true&&e.ok!==false)continue;
  const h=QH[e.q]||(QH[e.q]={n:0,errs:0,streak:0,last:0,lastErr:0});
  h.n++;h.last=e.t;if(e.ok)h.streak++;else{h.errs++;h.streak=0;h.lastErr=e.t}}
}
const noCad=q=>{const h=QH[q.id];return h&&h.errs>0&&h.streak<LAD.length};
const dueT=h=>sod(h.last)+LAD[Math.min(h.streak,LAD.length-1)]*DAY;
function cadernoList(){return Q.filter(q=>!S(q).m.lix&&(noCad(q)||(S(q).m.rev)))}
function dueList(){
 const t=now();
 return Q.filter(q=>!S(q).m.lix&&((noCad(q)&&dueT(QH[q.id])<=t)||S(q).m.rev)).sort((a,b)=>{const ta=QH[a.id]?dueT(QH[a.id]):0,tb=QH[b.id]?dueT(QH[b.id]):0;return ta-tb})
}
function cardList(){
 const t=now();
 return Q.filter(q=>{const h=QH[q.id];if(!h||!h.errs||S(q).m.lix)return false;const c=S(q).cd;return c?(c.b<CAD.length&&c.d<=t):true}).sort((a,b)=>(QH[a.id].lastErr)-(QH[b.id].lastErr));
}
/* ---------- estatísticas ---------- */
function stats(){
 const by={};
 for(const q of Q){const m=mod(q);const o=by[m]||(by[m]={m,b:blk(q),n:0,seen:0,r1:0,r1seen:0,ok:0,tot:0,rec:[]});o.n++;if(rr(q)===1)o.r1++;if(QH[q.id]){o.seen++;if(rr(q)===1)o.r1seen++}}
 for(const e of EV){if(e.ok!==true&&e.ok!==false)continue;const q=QM.get(e.q);if(!q)continue;const o=by[mod(q)];o.tot++;if(e.ok)o.ok++;o.rec.push(e.ok?1:0)}
 for(const o of Object.values(by)){const r=o.rec.slice(-40),s=r.reduce((a,b)=>a+b,0);o.p=(s+1)/(r.length+2);o.liq=2*o.p-1;o.cov=o.seen/o.n;o.cov1=o.r1?o.r1seen/o.r1:1}
 const proj=b=>{let s=0,w=0;for(const [m,x] of Object.entries(WT[b])){s+=x*(by[m]?by[m].liq:0);w+=x}return s/w};
 return{by,p1:proj("P1"),p2:proj("P2")};
}
function weekly(){
 const out=[],t0=sod(now());
 for(let w=7;w>=0;w--){const a=t0-(w*7+6)*DAY,b=t0-(w*7-1)*DAY;let o=0,e=0;for(const x of EV){if(x.t>=a&&x.t<b){if(x.ok===true)o++;else if(x.ok===false)e++}}out.push({n:o+e,liq:o+e?(o-e)/(o+e):null})}
 return out;
}
function perDay(){const m={};for(const e of EV){if(e.ok===true||e.ok===false){const d=sod(e.t);m[d]=(m[d]||0)+1}}return m}
function chutes(){let g=0,go=0,s=0,so=0;for(const e of EV){if(e.ok!==true&&e.ok!==false)continue;if(e.cf===0){g++;if(e.ok)go++}else if(e.cf===1){s++;if(e.ok)so++}}return{g,go,s,so}}
function causas(){const c={nao:0,peg:0,mal:0,chu:0};for(const s of Object.values(ST))if(s.cz)for(const k in s.cz)c[k]=(c[k]||0)+s.cz[k];return c}
function medMs(){const a=EV.filter(e=>e.ms&&e.ms<180000).slice(-200).map(e=>e.ms).sort((x,y)=>x-y);return a.length?a[a.length>>1]:0}
function phase(){
 const t=now();
 if(t<new Date(2026,10,16).getTime())return{n:"Cobertura",fim:new Date(2026,10,15,23,59).getTime(),txt:"Ver ao menos uma vez as questões de maior incidência de cada matéria."};
 if(t<new Date(2027,0,1).getTime())return{n:"Consolidação",fim:new Date(2026,11,31,23,59).getTime(),txt:"Fechar lacunas, esvaziar o caderno de erros e fazer um simulado por semana."};
 return{n:"Reta final",fim:EXAM,txt:"Sem conteúdo novo: simulados, caderno de erros e revisão dos pontos fracos."};
}
function insights(S0){
 const out=[];const d=dueList().length,c=cardList().length;
 if(d)out.push({k:"er",i:"ERROS",t:`${d} ${d===1?"questão errada vence":"questões erradas vencem"} hoje no caderno.`,a:{go:{mode:"erros"}},b:"Refazer"});

 if(DB)saveQ=saveQ.then(async()=>{try{await DB.doc("simulados/"+sm.id).set(sm)}catch(x){}});
 render();window.scrollTo(0,0);
}
function simDiscard(){SIM=null;try{localStorage.removeItem(LSIM)}catch(e){}render()}
function fmtT(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+"min"+String(s).padStart(2,"0")}
function vSim(){
 if(SIM&&!SIM.done)return simRun();
 if(SIM&&SIM.done)return simResult(SIM);
 const M=Motor.META;
 let h=`<section class="card"><div class="lbl">Simulado</div><h2 style="margin:4px 0 8px">Prova com desconto de erro</h2><p>Itens Certo/Errado, nota líquida (acertos menos erros), sem gabarito até o fim. As questões vêm das mais cobradas e das menos vistas. A distribuição por matéria é uma estimativa.</p>
 <div class="row" style="margin-top:12px"><button class="btn pri" data-sim='["P1",90]'>Prova 1 · 90 itens</button><button class="btn pri" data-sim='["P2",90]'>Prova 2 · 90 itens</button><button class="btn" data-sim='["P1",30]'>Mini P1 · 30</button><button class="btn" data-sim='["P2",30]'>Mini P2 · 30</button></div></section>`;
 if(SIMS.length){
  h+=`<section class="card"><div class="lbl">Seus simulados</div><div class="tw"><table><thead><tr><th>Data</th><th>Prova</th><th class="n">Itens</th><th class="n">C/E/B</th><th class="n">Líquido</th><th class="n">Tempo</th></tr></thead><tbody>${SIMS.slice().reverse().slice(0,12).map(s=>`<tr><td>${new Date(s.t).toLocaleDateString("pt-BR")}</td><td>${s.b}</td><td class="n">${s.n}</td><td class="n">${s.c}/${s.e}/${s.bl}</td><td class="n" style="color:${s.liq>=M.pp?"var(--ok)":"var(--err)"}">${s.c-s.e} (${pct(s.liq)})</td><td class="n">${fmtT(s.ms)}</td></tr>`).join("")}</tbody></table></div><p class="nota" style="margin-top:8px">Meta provisória: ${pct(M.pp)} líquido.</p></section>`;
 }
 return h;
}
function simRun(){
 const n=SIM.ids.length,id=SIM.ids[SIM.i],q=QM.get(id),r=SIM.ans[id]||"",resp=Object.keys(SIM.ans).length;
 return`<div class="sbar"><span>Prova ${SIM.b} · item <b>${SIM.i+1}</b> de ${n}</span><span>respondidos <b>${resp}</b> · em branco <b>${n-resp}</b> · ${fmtT(now()-SIM.t0)}</span></div>
 <div class="q">${crumb(q)}<p class="enun">${esc(q.e)}</p>
 <div class="resp"><button data-sa="C" aria-pressed="${r==="C"}" style="${r==="C"?"border-color:var(--acc);background:var(--accbg)":""}">Certo<small>C</small></button><button data-sa="E" style="${r==="E"?"border-color:var(--acc);background:var(--accbg)":""}">Errado<small>E</small></button></div>
 <div class="prox"><button class="btn" data-sg="${SIM.i-1}" ${SIM.i?"":"disabled"}>Anterior</button><button class="btn" data-sg="${SIM.i+1}" ${SIM.i<n-1?"":"disabled"}>Próxima</button></div></div>
 <section class="card"><div class="lbl">Navegação</div><div class="sim-grid" style="margin-top:8px">${SIM.ids.map((x,k)=>`<button data-sg="${k}" data-s="${SIM.ans[x]||""}" aria-current="${k===SIM.i}">${k+1}</button>`).join("")}</div>
 <div class="row" style="margin-top:12px;justify-content:space-between"><span class="nota">Deixar em branco vale zero; marcar errado anula um acerto.</span><span class="row"><button class="btn sm" data-a="simdisc">Descartar</button><button class="btn pri" data-a="simfim">Entregar prova</button></span></div></section>`;
}
function simResult(s){
 const n=s.ids.length,M=Motor.META;let c=0,e=0,bl=0;const pm={},err=[];
 s.ids.forEach(id=>{const q=QM.get(id),r=s.ans[id]||"B",ok=r==="B"?null:r===q.g,m=mod(q),o=pm[m]||(pm[m]={n:0,c:0,e:0,b:0});o.n++;if(ok===true){c++;o.c++}else if(ok===false){e++;o.e++;err.push(q)}else{bl++;o.b++}});
 const liq=(c-e)/n;
 return`<section class="card"><div class="lbl">Resultado · Prova ${s.b}</div><div class="count" style="margin-top:6px"><b>${c-e}</b><span>pontos líquidos de ${n} (${pct(liq)}). Meta provisória ${pct(M.pp)}.</span></div>
 <p style="margin:10px 0 0">${c} certas, ${e} erradas, ${bl} em branco, em ${fmtT(s.el)}. ${liq>=M.pp?"Acima da meta provisória.":"Abaixo da meta provisória: os erros abaixo já entraram no caderno."}</p></section>
 <section class="card"><div class="lbl">Por matéria</div><div class="tw"><table><thead><tr><th>Matéria</th><th class="n">Itens</th><th class="n">C</th><th class="n">E</th><th class="n">Líquido</th></tr></thead><tbody>${Object.entries(pm).map(([m,o])=>`<tr><td>${esc(m)}</td><td class="n">${o.n}</td><td class="n">${o.c}</td><td class="n">${o.e}</td><td class="n">${pct((o.c-o.e)/o.n)}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><div class="lbl">Erros do simulado (${err.length})</div>${err.map(q=>`<div class="er-item"><div class="row"><span class="chip">${esc(mod(q))}</span></div><p style="font-family:var(--f-read)">${esc(q.e)}</p><p class="rule"><b>${q.g==="C"?"Certo":"Errado"}.</b> ${esc(ruleOf(q))}</p></div>`).join("")||"<p class='nota'>Nenhum erro.</p>"}</section>
 <div class="row"><button class="btn pri" data-a="simclose">Concluir</button></div>`;
}
/* ---------- painel ---------- */
function trendSvg(w,meta){
 const W=320,H=96,pl=26,pr=8,pt=8,pb=16,pts=w.map((x,i)=>x.liq==null?null:{x:pl+i*(W-pl-pr)/7,y:pt+(1-(Math.max(-0.4,Math.min(1,x.liq))+0.4)/1.4)*(H-pt-pb)});
 const ys=v=>pt+(1-(v+0.4)/1.4)*(H-pt-pb);
 let line="",area="",first=null,last=null;const ok=pts.filter(Boolean);
 if(ok.length){line=ok.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");area=line+` L${ok[ok.length-1].x.toFixed(1)} ${H-pb} L${ok[0].x.toFixed(1)} ${H-pb} Z`;last=ok[ok.length-1]}
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Líquido por semana"><line class="gd" x1="${pl}" x2="${W-pr}" y1="${ys(0)}" y2="${ys(0)}"/><line class="mt" x1="${pl}" x2="${W-pr}" y1="${ys(meta)}" y2="${ys(meta)}"/><text x="2" y="${ys(0)+3}">0%</text><text x="2" y="${ys(meta)+3}">${Math.round(meta*100)}</text><text x="${pl}" y="${H-3}">há 8 sem.</text><text x="${W-pr-24}" y="${H-3}">esta sem.</text>${area?`<path class="ar" d="${area}"/><path class="ln" d="${line}"/>`:""}${last?`<circle class="pt" cx="${last.x}" cy="${last.y}" r="3.5"/>`:""}</svg>`;
}
function vPainel(){
 const S0=stats(),M=Motor.META,R=Motor.readiness(Q.filter(q=>!S(q).m.lix),EV,now()),wk=weekly(),ch=chutes(),cz=causas(),ms=medMs();
 const cs=Object.values(cz).reduce((a,b)=>a+b,0);
 const ruim=Q.filter(q=>S(q).m.ruim),lix=Q.filter(q=>S(q).m.lix);
 const rein=Q.filter(q=>QH[q.id]&&QH[q.id].errs>=2).sort((a,b)=>QH[b.id].errs-QH[a.id].errs).slice(0,8);
 const rows=Object.values(S0.by).sort((a,b)=>a.b.localeCompare(b.b)||a.liq-b.liq);
 let h=`<section class="card"><div class="lbl">Projeção por prova</div><div class="gauge" style="margin-top:8px">${gaugeRow("P1",S0.p1,"p1",M.pp)}${gaugeRow("P2",S0.p2,"p2",M.pp)}</div><p class="nota" style="margin-top:8px">Preparo no banco inteiro (não visto vale zero): <b class="num">${pct(R.geral)}</b> · vistas ${R.vistos} de ${R.n}. Meta provisória: ${esc(M.nota)}.</p></section>
 <section class="card"><div class="lbl">Líquido por semana</div>${trendSvg(wk,M.pp)}<p class="nota">Acertos menos erros sobre o total de cada semana. Linha tracejada: meta provisória.</p></section>
 <section class="card"><div class="lbl">Por matéria</div><div class="tw"><table><thead><tr><th>Matéria</th><th>Vistas (alta incid.)</th><th class="n">Resp.</th><th class="n">Líquido</th><th class="n">Peso</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.m)} <span class="chip ${o.b==="P1"?"p1":"p2"}">${o.b}</span></td><td><div class="minibar"><i style="width:${100*o.cov1}%"></i></div></td><td class="n">${o.tot}</td><td class="n">${o.tot?pct(o.liq):"–"}</td><td class="n">${(WT[o.b]||{})[o.m]||0}</td></tr>`).join("")}</tbody></table></div><p class="nota" style="margin-top:6px">Peso: itens estimados em cada prova de 90.</p></section>
 <div class="grid2"><section class="card"><div class="lbl">Palpites</div>${ch.g+ch.s?`<p style="margin:8px 0 0">Com certeza: <b class="num">${ch.s?pct(ch.so/ch.s):"–"}</b> de acerto em ${ch.s}.<br>Palpite: <b class="num">${ch.g?pct(ch.go/ch.g):"–"}</b> em ${ch.g}.</p><p class="nota" style="margin-top:6px">Acima de 50% palpitar compensa; abaixo, deixe em branco.</p>`:`<p class="nota" style="margin-top:8px">Marque Palpite no treino quando for chutar para o site medir se compensa.</p>`}</section>
 <section class="card"><div class="lbl">Por que você erra</div>${cs?CAUSAS.map(([k,l])=>`<div class="g" style="grid-template-columns:6rem 1fr 2rem;margin-top:6px"><span>${l}</span><div class="track"><i style="width:${100*cz[k]/cs}%"></i></div><span class="num">${cz[k]}</span></div>`).join(""):`<p class="nota" style="margin-top:8px">Depois de um erro, toque na causa. Isso mostra se o problema é conteúdo, pegadinha ou leitura.</p>`}${ms?`<p class="nota" style="margin-top:8px">Tempo mediano por questão: <b class="num">${Math.round(ms/1000)} s</b>.</p>`:""}</section></div>`;
 if(rein.length)h+=`<section class="card"><div class="lbl">Mais erradas</div>${rein.map(q=>`<div class="er-item"><div class="row"><span class="chip">${esc(mod(q))}</span><span class="chip er">${QH[q.id].errs}×</span></div><p class="rule">${esc(ruleOf(q))}</p></div>`).join("")}</section>`;
 h+=`<div class="row"><button class="btn" id="bExp">Exportar meu histórico (JSON)</button><span class="nota">${ruim.length} marcadas como ruins · ${lix.length} na lixeira</span></div>`;
 if(ruim.length)h+=`<section class="card"><div class="lbl">Marcadas como ruins</div>${ruim.slice(0,30).map(q=>`<div class="er-item"><p>${esc(q.id)}: ${esc(q.e)}</p></div>`).join("")}</section>`;
 if(lix.length)h+=`<section class="card"><div class="lbl">Lixeira</div>${lix.slice(0,30).map(q=>`<div class="er-item"><p>${esc(q.id)}: ${esc(q.e)}</p><div><button class="btn sm" data-rest="${q.id}">Restaurar</button></div></div>`).join("")}</section>`;
 return h;
}
/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset;
 if(d.nav){view=d.nav;if(d.nav==="treino"&&!sess)sess=newSess({});render();window.scrollTo(0,0);return}
 if(d.go!==undefined){go(JSON.parse(d.go||"{}"));return}
 if(d.ins){const a=JSON.parse(d.ins);if(a.go)go(a.go);else if(a.nav){view=a.nav;if(a.tab)errTab=a.tab;render()}return}
 if(d.r){answer(d.r);return}
 if(d.m){mark(d.m);return}
 if(d.cz){causa(d.cz);return}
 if(t.id==="bNext"){next();return}
 if(t.id==="bPal"){palp=!palp;render();return}
 if(d.tab){errTab=d.tab;cardSt=null;render();return}
 if(d.sim){const [b,n]=JSON.parse(d.sim);simStart(b,n);return}
 if(d.sa){simAns(d.sa);return}
 if(d.sg!==undefined){simGo(+d.sg);return}
 if(d.rest){const q=QM.get(d.rest);delete S(q).m.lix;S(q).u=now();persist(q.id);render();return}
 if(t.id==="bExp"){(async()=>{try{const dl=await claude.use("downloads");if(!dl){t.textContent="Download indisponível aqui";return}await dl.save({filename:"historico_camara2026.json",data:JSON.stringify({exportado:new Date().toISOString(),estado:ST,eventos:EV,simulados:SIMS},null,1)})}catch(x){}})();return}
 switch(d.a){
  case"fim":cur=null;answered=null;sess.ended=true;render();break;
  case"flip":cardSt=1;render();break;
  case"cgood":gradeCard(true);break;
  case"cbad":gradeCard(false);break;
  case"simfim":simFinish();break;
  case"simdisc":simDiscard();break;
  case"simclose":simDiscard();break;
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="fScope"){const v=t.value,f={blk:"",mod:"",top:""};if(v.startsWith("blk:"))f.blk=v.slice(4);else if(v.startsWith("mod:"))f.mod=v.slice(4);sess.f=f;cur=null;answered=null;render()}
 if(t.id==="fMode"){sess.mode=t.value;cur=null;answered=null;render()}
 if(t.id==="fEM"){errMod=t.value;cardSt=null;render()}
});
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="SELECT")return;
 const k=e.key.toLowerCase();
 if(view==="treino"&&sess&&!sess.ended){
  if(!answered){if(k==="c")answer("C");else if(k==="e")answer("E");else if(k==="b")answer("B");else if(k==="p"){palp=!palp;render()}}
  else{if(k==="enter"||k===" "){e.preventDefault();next()}
   else if("1234".includes(k)&&k){const c=CAUSAS[+k-1];if(c)causa(c[0])}
   else{const m={d:"dif",v:"rev",r:"ruim",x:"lix"}[k];if(m)mark(m)}}
 }else if(view==="sim"&&SIM&&!SIM.done){
  if(k==="c")simAns("C");else if(k==="e")simAns("E");else if(k==="arrowright"||k==="n")simGo(SIM.i+1);else if(k==="arrowleft"||k==="p")simGo(SIM.i-1);
 }
});
load().catch(e=>{$("app").innerHTML='<div class="vazio">Erro ao carregar o banco: '+esc(e.message)+'</div>'});
</script>
